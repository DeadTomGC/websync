# Example mapping config: Cameo Teamwork Cloud <-> Jama requirements.
# See docs/plan/03-mapping-configuration-spec.md for the full schema.
program: programA
links:
  - name: cameo-jama-requirements
    source: cameo_twc
    target: jama
    types:
      requirement: requirement
      interface: interfaceRequirement
    scope:
      source:
        project: "Program A / SysModel"   # TWC project path/ID
      target:
        project: 123                       # Jama container/project ID
        item_type_filter: [requirement]
    fields:
      title:
        source: name
        target: name
      text:
        source: specification
        target: description
        format: plain
      status:
        source: status
        target: status
        value_map:
          draft: "In Progress"
          approved: "Approved"
    direction: bidirectional
    conflict_strategy: newest_wins
    create_missing: true
    delete_behavior: skip
